[project]
name = "day24"
version = "0.1.0"
description = "Day 24: Deep Agents with Azure OpenAI, custom tools, and subagents"
readme = "README.md"
authors = [
    { name = "Athena Kanellatou", email = "kanellatouathina@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
day24 = "day24:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
